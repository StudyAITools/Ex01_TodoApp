<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="할 일을 추가하고 완료 여부를 관리하는 간단한 TODO 앱">
  <title>할 일</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233462e4'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>할 일</h1>
        <p class="today" id="today"></p>
      </div>
      <div class="summary" id="summary" hidden>
        <span id="progress-text"></span>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
      </div>
    </header>

    <form class="new-todo" id="new-todo-form" autocomplete="off">
      <label class="visually-hidden" for="new-todo">새 할 일</label>
      <input class="new-todo-input" id="new-todo" name="title" type="text" placeholder="무엇을 해야 하나요?" autofocus>
      <button class="btn btn-primary" type="submit">추가</button>
    </form>

    <p class="notice" id="storage-warning" role="alert" hidden>
      브라우저 저장소를 사용할 수 없어요. 새로고침하면 목록이 사라집니다.
    </p>

    <section aria-labelledby="list-heading">
      <h2 class="visually-hidden" id="list-heading">할 일 목록</h2>

      <div class="toolbar" id="toolbar" hidden>
        <nav class="filters" aria-label="보기 필터">
          <a href="#/" data-filter="all">전체 <span class="filter-count" data-count="total"></span></a>
          <a href="#/active" data-filter="active">진행 중 <span class="filter-count" data-count="active"></span></a>
          <a href="#/completed" data-filter="completed">완료 <span class="filter-count" data-count="completed"></span></a>
        </nav>
        <button class="btn btn-ghost" id="toggle-all" type="button">모두 완료</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty-state" id="empty-state" hidden></p>

      <footer class="footer" id="footer" hidden>
        <span id="todo-count"></span>
        <button class="btn btn-link" id="clear-completed" type="button" hidden>완료 항목 삭제</button>
      </footer>
    </section>
  </main>

  <p class="app-hint">
    항목을 더블클릭하면 수정할 수 있어요 · <kbd>Enter</kbd> 저장 · <kbd>Esc</kbd> 취소
  </p>

  <div class="toast" id="toast" hidden>
    <span class="toast-message" id="toast-message"></span>
    <button class="toast-undo" id="toast-undo" type="button">실행 취소</button>
  </div>
  <div class="visually-hidden" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <noscript><p class="noscript">이 앱을 사용하려면 JavaScript를 켜 주세요.</p></noscript>

  <template id="todo-item-template">
    <li class="todo-item">
      <div class="todo-view">
        <label class="todo-check">
          <input class="todo-toggle" type="checkbox">
        </label>
        <span class="todo-title"></span>
        <div class="todo-actions">
          <button class="icon-btn todo-edit-btn" type="button" title="수정">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn todo-delete" type="button" title="삭제">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </div>
    </li>
  </template>

  <template id="todo-edit-template">
    <form class="todo-edit-form">
      <input class="todo-edit-input" name="title" type="text" autocomplete="off" enterkeyhint="done" aria-label="할 일 수정">
    </form>
  </template>
</body>
</html>
